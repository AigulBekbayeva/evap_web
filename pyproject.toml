[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sorbulak-evap"
version = "0.2.0"
description = "Расчёт и прогноз испарения с водной поверхности по ERA5-Land и спутниковой температуре воды"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0", "pyogrio>=0.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
evap = "evap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
